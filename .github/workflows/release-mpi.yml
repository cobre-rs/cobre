# Build MPI-enabled binaries and attach them to the GitHub Release created by
# the main release.yml (cargo-dist).  Triggered by the same version tags.
#
# Produces one archive per platform:
#   cobre-mpi-<version>-<target>.tar.gz
#
# The archive contains the `cobre-mpi` binary and a README.
#
# Linux targets build MPICH from source (cached) to link against `libmpi.so`
# (the upstream/universal name). Ubuntu's apt `libmpich-dev` package renames
# the library to `libmpich.so`, which doesn't exist on HPC clusters where
# MPICH is compiled from source, Spack, or module systems.
#
# aarch64-unknown-linux-gnu uses GitHub's free ARM64 runners (ubuntu-24.04-arm)
# available for public repositories since January 2025.
#
# x86_64-apple-darwin is omitted: the macos-13 Intel runner was deprecated and
# cross-compiling MPI on ARM runners is non-trivial. Intel Mac users can build
# from source with `cargo build --release --features mpi -p cobre-cli`.

name: Release MPI

permissions:
  contents: write

on:
  push:
    tags:
      - "**[0-9]+.[0-9]+.[0-9]+*"

env:
  MPICH_VERSION: "4.2.3"

jobs:
  build-mpi:
    name: mpi (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            mpi_source: source
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            mpi_source: source
          - target: aarch64-apple-darwin
            runner: macos-14
            mpi_source: brew
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: mpi-${{ matrix.target }}

      # --- MPICH from source (Linux) ---
      # Cached by version+arch. Only headers and libmpi.so are needed at
      # compile time — the user's own MPICH is loaded at runtime.
      - name: Cache MPICH
        if: matrix.mpi_source == 'source'
        id: mpich-cache
        uses: actions/cache@v5
        with:
          path: /opt/mpich
          key: mpich-${{ env.MPICH_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build MPICH from source
        if: matrix.mpi_source == 'source' && steps.mpich-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q "https://www.mpich.org/static/downloads/${MPICH_VERSION}/mpich-${MPICH_VERSION}.tar.gz"
          tar xzf "mpich-${MPICH_VERSION}.tar.gz"
          cd "mpich-${MPICH_VERSION}"
          # ch3:nemesis is used for compile-time headers only. At runtime,
          # the user's cluster MPICH (typically ch4:ofi) is loaded via
          # LD_LIBRARY_PATH or module system. ABI compatibility is maintained
          # regardless of device layer.
          ./configure --prefix=/opt/mpich \
              --disable-fortran \
              --disable-cxx \
              --disable-romio \
              --disable-doc \
              --with-device=ch3:nemesis
          make -j"$(nproc)"
          make install

      - name: Set MPICH environment (Linux)
        if: matrix.mpi_source == 'source'
        run: |
          echo "/opt/mpich/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=/opt/mpich/lib/pkgconfig" >> "$GITHUB_ENV"

      # --- MPICH from Homebrew (macOS) ---
      - name: Install MPICH (brew)
        if: matrix.mpi_source == 'brew'
        run: brew install mpich

      - name: Build cobre with MPI
        run: cargo build --release --features mpi -p cobre-cli

      - name: Package archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="cobre-mpi-${VERSION}-${{ matrix.target }}.tar.gz"

          mkdir -p staging
          cp target/release/cobre staging/cobre-mpi
          # Third-party attribution travels with the statically-linked binary.
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md staging/

          cat > staging/README.txt << 'EOF'
          cobre-mpi — Cobre SDDP solver with MPI communication backend.

          This binary links against libmpi.so.12 (MPICH 4.x ABI).
          Compatible runtimes:
            - MPICH 4.0+  (recommended)
            - Intel MPI 2021+  (MPICH ABI compatible)
            - MVAPICH2 3.0+  (MPICH ABI compatible)

          Ensure libmpi.so.12 is discoverable at runtime:
            export LD_LIBRARY_PATH=/path/to/mpich/lib:$LD_LIBRARY_PATH
            mpiexec -n <nprocs> ./cobre-mpi run <case-dir>

          With SLURM:
            srun --mpi=pmi2 -n <nprocs> ./cobre-mpi run <case-dir>

          For hybrid MPI + threads on SLURM:
            srun --mpi=pmi2 --cpus-per-task=8 --cpu-bind=cores \
                 ./cobre-mpi run <case-dir> --threads 8

          Or use your cluster's module system (e.g. `module load mpich`).

          For the single-process variant (no MPI dependency), download
          the standard 'cobre' binary from the same GitHub release.

          Stopping before a SLURM time limit
          ----------------------------------

          A SIGTERM during training makes cobre-mpi stop at the next iteration
          boundary on every rank, write the training outputs and the policy
          checkpoint, and exit with code 5. The configured simulation is then
          skipped: simulation/metadata.json is written with status "partial" and
          0 completed scenarios. This also holds when the signal arrives in the
          iteration where a stopping rule ends training, or while the training
          outputs are being written. To continue training, set
          "policy": {"mode": "resume"} in config.json and run again with the same
          output directory.

          To have SLURM send that SIGTERM before the time limit, request it in the
          batch script and launch the ranks with srun, so that the signal reaches
          them:

            #SBATCH --time=<walltime>
            #SBATCH --signal=TERM@<lead>

            srun --mpi=pmix -n <nprocs> ./cobre-mpi run <case-dir>

          Do not use the B: prefix (--signal=B:TERM@<lead>): it signals only the
          batch shell, not the ranks.

          <lead> is in seconds. It must cover, from the moment the signal arrives:
            - one periodic checkpoint write, because a signal that arrives during
              one takes effect only at the end of the following iteration;
            - the longest training iteration;
            - the final write of the training outputs and the checkpoint;
            - a margin.
          Measure these on an earlier run of the same case, with a similar number
          of iterations, on the same file system. The time_total_ms column of
          training/convergence.parquet holds each iteration's time. Without
          --quiet, the "Output written to" line ends with the time of the final
          write, which includes a checkpoint write; use that time for the periodic
          write as well. Each checkpoint write syncs every policy file to storage,
          so its time grows with the size of the policy and with the file
          system's sync latency. The lead does not need to cover the simulation,
          because a signal stop skips it.

          SLURM may send the signal up to 60 seconds earlier than requested. At
          the time limit SLURM sends SIGTERM again, which only repeats the stop
          request, and SIGKILL follows after the cluster's KillWait interval (30
          seconds by default; set by the site). A run that SIGKILL ends keeps only
          its last periodic checkpoint, so enable periodic checkpoints:
          "policy": {"checkpointing": {"enabled": true, "interval_iterations": N}}.
          Each periodic write adds its time to the training, so a larger N spends
          less time writing and loses more iterations when SIGKILL ends the run.

          A training time_limit stopping rule below the walltime can be the main
          stop, with the signal as the backup. A time_limit stop exits 0 and runs
          the configured simulation, and a SIGTERM that arrives while the
          simulation runs terminates the job without a graceful stop. Choose the
          time_limit so that setup, training up to the time_limit plus one more
          iteration, the final writes and the whole simulation finish before SLURM
          sends the signal. The time_limit counts the training time of each run,
          so it applies again after a resume.

          Use one writer per policy directory: never point a run at a policy
          directory that another job is writing (for example, a simulation-only
          run beside a training run that writes periodic checkpoints), because
          its ranks may read a copy that changes during the read. On an
          NFS-backed output directory (including EFS), start the reading job only
          after the writer has finished and the client's attribute cache (the
          acdirmax mount option) has expired; a parallel file system such as
          Lustre or FSx for Lustre has no such delay.

          To stop a running job early and keep its checkpoint, send the signal
          yourself: scancel --signal=TERM <jobid> (verify on your site that it
          reaches the job's srun tasks). A plain scancel <jobid> sends SIGTERM and
          then SIGKILL after KillWait, so the stop has to finish within KillWait.

          In a job script, check training/_SUCCESS as well as the exit code. A
          run that trains deletes that marker before training starts and writes
          it after the training outputs and the checkpoint; simulation/_SUCCESS
          likewise follows the simulation outputs, or the "partial" metadata of
          a skipped simulation. After a forced abort, such as SIGKILL or a
          second Ctrl-C to mpiexec, the launcher's exit code does not show
          whether any outputs were written: MPICH's mpiexec can then exit 0.

          Troubleshooting
          ---------------

          srun --mpi=pmi2 fails with "pmijobid missing in fullinit command":
            This error is caused by an incompatibility between SLURM 24.05's
            PMI2 plugin and MPICH's PMI2 wire protocol. Use mpiexec as a
            fallback launcher, which bypasses PMI2 entirely:
              mpiexec -n <nprocs> ./cobre-mpi run <case-dir>
            Alternatively, if PMIx is available on the cluster:
              srun --mpi=pmix -n <nprocs> ./cobre-mpi run <case-dir>

          Multi-node job hangs at MPI_Init (MPICH 4.3.x clusters):
            MPICH 4.3.0 introduced a PMI2 client regression that causes a
            multi-proxy KVS barrier deadlock in Hydra during MPI_Init when
            running across multiple nodes. If your cluster runs MPICH 4.3.x,
            downgrade to MPICH 4.2.x to avoid this hang.
          EOF

          tar czf "$ARCHIVE" -C staging .
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        run: |
          # Wait for the main release workflow (cargo-dist) to create the
          # GitHub Release. With Windows targets the build can take 15+ minutes.
          for i in $(seq 1 30); do
            if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
              echo "Release $GITHUB_REF_NAME found."
              break
            fi
            echo "Waiting for release $GITHUB_REF_NAME... ($i/30)"
            sleep 30
          done
          gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" --clobber
