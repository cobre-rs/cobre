[package]
name = "cobre-comm"
description = "Pluggable communication backend abstraction for the Cobre ecosystem (MPI, TCP, shared-memory, local)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["mpi", "distributed", "communication", "hpc", "parallelism"]
categories = ["science", "network-programming"]

[dependencies]
thiserror = "2"
ferrompi = { version = "0.5", optional = true }
gethostname = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[features]
mpi = ["dep:ferrompi"]
affinity = ["dep:libc"]
numa = ["mpi", "affinity", "ferrompi/numa"]
# Experimental intra-node shared-memory region API. Off by default — the
# current implementation is a heap-backed placeholder (HeapRegion) with no
# true memory sharing across ranks. Enable to access SharedMemoryProvider,
# SharedRegion, LocalCommunicator, and HeapRegion. Composable with `mpi`.
shared-memory = []

[dev-dependencies]
rayon.workspace = true

# Override unsafe_code to "allow" for this crate because FerrompiBackend requires
# `unsafe impl Send` and `unsafe impl Sync` to satisfy the Communicator trait bounds.
# ferrompi::Mpi is !Send + !Sync (PhantomData<*const ()>), but the RAII pattern
# guarantees construction and finalization happen on the same thread, making the
# unsafe impl sound. All other workspace lints are manually replicated here since
# Cargo does not permit combining `lints.workspace = true` with per-lint overrides.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
too_many_arguments = "deny"
