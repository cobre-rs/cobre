name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  MPICH_VERSION: "4.2.3"
  # Non-solver features enabled on BOTH backend jobs. The HiGHS and CLP jobs
  # differ ONLY in the solver feature (default `highs` vs.
  # `--no-default-features --features clp`); every other feature that the former
  # `--all-features` convention covered is enumerated here so neither backend
  # loses non-solver coverage. Features are unified workspace-wide by name, so
  # this is the deduplicated union across crates:
  #   cobre-comm:       mpi, numa, shared-memory
  #   cobre-core:       serde, schema
  #   cobre-io:         schema, flatc-conformance, slow-tests
  #   cobre-solver:     test-support
  #   cobre-sddp:       slow-tests
  #   cobre-stochastic: slow-tests
  #   cobre-cli:        mpi, slow-tests
  # `slow-tests` is kept ON: the D-case `parity_hash` correctness sweep is gated
  # behind it, so the primary backend must enable it to run that sweep.
  # `cobre-sddp/dhat-heap` is deliberately EXCLUDED: it swaps in a profiling
  # global allocator ("Never enable by default") that alters allocation behavior
  # for every test; it belongs only to the `dhat_baseline` example, never the
  # regular test/coverage runs.
  NON_SOLVER_FEATURES: "mpi numa shared-memory serde schema slow-tests flatc-conformance test-support"

jobs:
  check:
    name: Check (HiGHS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Cache MPICH
        id: mpich-cache
        uses: actions/cache@v5
        with:
          path: /opt/mpich
          key: mpich-${{ env.MPICH_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build MPICH from source
        if: steps.mpich-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q "https://www.mpich.org/static/downloads/${MPICH_VERSION}/mpich-${MPICH_VERSION}.tar.gz"
          tar xzf "mpich-${MPICH_VERSION}.tar.gz"
          cd "mpich-${MPICH_VERSION}"
          ./configure --prefix=/opt/mpich \
              --disable-fortran \
              --disable-cxx \
              --disable-romio \
              --disable-doc \
              --with-device=ch3:nemesis
          make -j"$(nproc)"
          make install
      - name: Set MPICH environment
        run: |
          echo "/opt/mpich/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=/opt/mpich/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/mpich/lib" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --features "${{ env.NON_SOLVER_FEATURES }}"

  test:
    name: Test (HiGHS)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Cache MPICH
        id: mpich-cache
        uses: actions/cache@v5
        with:
          path: /opt/mpich
          key: mpich-${{ env.MPICH_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build MPICH from source
        if: steps.mpich-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q "https://www.mpich.org/static/downloads/${MPICH_VERSION}/mpich-${MPICH_VERSION}.tar.gz"
          tar xzf "mpich-${MPICH_VERSION}.tar.gz"
          cd "mpich-${MPICH_VERSION}"
          ./configure --prefix=/opt/mpich \
              --disable-fortran \
              --disable-cxx \
              --disable-romio \
              --disable-doc \
              --with-device=ch3:nemesis
          make -j"$(nproc)"
          make install
      - name: Set MPICH environment
        run: |
          echo "/opt/mpich/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=/opt/mpich/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/mpich/lib" >> "$GITHUB_ENV"
      - name: Install flatc (FlatBuffers compiler)
        run: sudo apt-get update && sudo apt-get install -y flatbuffers-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Full suite on the primary backend: unit + integration + the D-case
      # `parity_hash` correctness sweep (the sweep is gated behind `slow-tests`,
      # included in NON_SOLVER_FEATURES).
      - run: cargo test --workspace --features "${{ env.NON_SOLVER_FEATURES }}"

  clippy:
    name: Clippy (HiGHS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Cache MPICH
        id: mpich-cache
        uses: actions/cache@v5
        with:
          path: /opt/mpich
          key: mpich-${{ env.MPICH_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build MPICH from source
        if: steps.mpich-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q "https://www.mpich.org/static/downloads/${MPICH_VERSION}/mpich-${MPICH_VERSION}.tar.gz"
          tar xzf "mpich-${MPICH_VERSION}.tar.gz"
          cd "mpich-${MPICH_VERSION}"
          ./configure --prefix=/opt/mpich \
              --disable-fortran \
              --disable-cxx \
              --disable-romio \
              --disable-doc \
              --with-device=ch3:nemesis
          make -j"$(nproc)"
          make install
      - name: Set MPICH environment
        run: |
          echo "/opt/mpich/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=/opt/mpich/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/mpich/lib" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features "${{ env.NON_SOLVER_FEATURES }}" -- -D warnings

  # Lean secondary-backend job: builds the workspace against the CLP/CoinUtils
  # backend (vendored COIN superbuild) for plumbing correctness. Runs
  # check + clippy + build + unit + integration + CLP-specific parity baselines.
  # It does NOT run docs, fmt, coverage, or the heavy D-case correctness sweep —
  # those run once on the primary (HiGHS) backend.
  #
  # Built in its final `--no-default-features --features "clp <non-solver>"`
  # form. A green status across the whole workspace depends on the SDDP and
  # CLI/Python backend decoupling that lands later; until then this job exercises
  # the CLP wiring that is already decoupled.
  clp:
    name: CLP Backend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Cache MPICH
        id: mpich-cache
        uses: actions/cache@v5
        with:
          path: /opt/mpich
          key: mpich-${{ env.MPICH_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build MPICH from source
        if: steps.mpich-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q "https://www.mpich.org/static/downloads/${MPICH_VERSION}/mpich-${MPICH_VERSION}.tar.gz"
          tar xzf "mpich-${MPICH_VERSION}.tar.gz"
          cd "mpich-${MPICH_VERSION}"
          ./configure --prefix=/opt/mpich \
              --disable-fortran \
              --disable-cxx \
              --disable-romio \
              --disable-doc \
              --with-device=ch3:nemesis
          make -j"$(nproc)"
          make install
      - name: Set MPICH environment
        run: |
          echo "/opt/mpich/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=/opt/mpich/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/mpich/lib" >> "$GITHUB_ENV"
      - name: Install flatc (FlatBuffers compiler)
        run: sudo apt-get update && sudo apt-get install -y flatbuffers-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Distinct cache key suffix so the CLP job does NOT share the HiGHS target
      # directory and actually compiles the vendored COIN superbuild.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: clp
      # cargo-nextest gives per-process test isolation, which the CLP FFI suite
      # requires: an in-process runner can mask a CLP FFI SIGSEGV through
      # heap-layout luck, whereas nextest spawns each test in its own process so
      # a fault fails the case deterministically.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Check (CLP)
        run: cargo check --workspace --all-targets --no-default-features --features "clp ${{ env.NON_SOLVER_FEATURES }}"
      - name: Clippy (CLP)
        run: cargo clippy --workspace --all-targets --no-default-features --features "clp ${{ env.NON_SOLVER_FEATURES }}" -- -D warnings
      - name: Build (CLP)
        run: cargo build --workspace --all-targets --no-default-features --features "clp ${{ env.NON_SOLVER_FEATURES }}"
      # Unit + integration tests + the CLP-specific parity baselines (gated behind
      # `feature = "clp"`; the parity sweep un-ignores under `slow-tests`, which is
      # in NON_SOLVER_FEATURES). The HiGHS-keyed correctness tests are feature-gated
      # off under CLP and are neither compiled nor run here. Run under cargo nextest
      # for per-process isolation so the CLP parity sweep is a real regression gate
      # that surfaces any CLP FFI fault instead of masking it in-process.
      # `--no-fail-fast` runs the full multi-crate CLP sweep so one failure does not
      # hide later regressions.
      - name: Test (CLP)
        run: cargo nextest run --workspace --no-default-features --features "clp ${{ env.NON_SOLVER_FEATURES }}" --no-fail-fast

  # Formatting is solver-agnostic; it runs once (under the HiGHS pipeline) and is
  # NOT duplicated onto the CLP job.
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  quality-scripts:
    name: Quality Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the E4 rationale gate can compute the merge base
          # against the PR base / origin/main (git-diff-scoped enforcement).
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Infra genericity gate
        run: bash scripts/ci/check-infra-genericity.sh
      - name: Cut-selection determinism gate
        run: bash scripts/ci/check-cut-selection-determinism.sh
      - name: cfg(test) boundary drift guard (shared scan lib)
        # Fails if the holdout gates' cfg(test) boundary desyncs from the shared
        # scripts/ci/lib/comment_scan.sh definition.
        run: bash scripts/ci/lib/comment_scan.sh
      - name: Check for plan-structure leaks
        run: bash scripts/ci/check-no-plan-leaks.sh
      - name: Check for past_inflows regression
        run: bash scripts/ci/check-no-past-inflows.sh
      - name: Check repo-relative doc paths/links
        run: bash scripts/ci/check-doc-paths.sh
      - name: Check comment references (un-rottable-ref gate)
        run: bash scripts/ci/check-comment-refs.sh
      - name: Advisory — drift-prone line references in comments (E2)
        # ADVISORY: exits 0 regardless of hits; its output is informational and
        # never fails the job.
        run: bash scripts/ci/check-comment-line-refs.sh
      - name: Advisory — in-fn box-drawing banners / N5 candidates (E7)
        # ADVISORY: exits 0 regardless of hits; its output is informational and
        # never fails the job.
        run: bash scripts/ci/check-comment-banners.sh
      - name: Check for doc placeholders (E5 placeholder gate)
        run: bash scripts/ci/check-doc-placeholders.sh
      - name: Check rationale on new suppressions (E4 gate)
        # On pull_request events, diff against the PR base SHA; on push (and any
        # other event) BASE_REF is empty and the gate defaults to origin/main.
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/check-allow-rationale.sh
      - name: Check Python parity
        run: python3 scripts/ci/check_python_parity.py --max 0
      - name: Check doc voice (no hype / unpinned numbers)
        run: python3 scripts/ci/check_doc_voice.py
      - name: Advisory — code-quality hotspot report
        # ADVISORY: always exits 0. Prints a ranked "where to act first" table
        # (churn x size x suppression density x in-body banners) to the job log.
        run: bash scripts/ci/quality-report.sh

  schemas:
    name: Schema Freshness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Cache MPICH
        id: mpich-cache
        uses: actions/cache@v5
        with:
          path: /opt/mpich
          key: mpich-${{ env.MPICH_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build MPICH from source
        if: steps.mpich-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q "https://www.mpich.org/static/downloads/${MPICH_VERSION}/mpich-${MPICH_VERSION}.tar.gz"
          tar xzf "mpich-${MPICH_VERSION}.tar.gz"
          cd "mpich-${MPICH_VERSION}"
          ./configure --prefix=/opt/mpich \
              --disable-fortran \
              --disable-cxx \
              --disable-romio \
              --disable-doc \
              --with-device=ch3:nemesis
          make -j"$(nproc)"
          make install
      - name: Set MPICH environment
        run: |
          echo "/opt/mpich/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=/opt/mpich/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/mpich/lib" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify schema freshness
        run: ./scripts/ci/check_schemas.sh --build

  # Locks structural invariants of a fresh `cobre init` -> `run` -> `report`
  # (template file count, training/metadata.json keys, policy/metadata.json
  # warm-start keys, the `cobre report` key set) against the live binary, so the
  # CLI's on-disk/stdout output shape cannot silently drift. Minimal setup: only
  # the default-feature (HiGHS) `cobre` binary is needed — no MPICH or flatc,
  # since the default CLI build enables neither `mpi` nor `flatc-conformance`.
  # `jq` is preinstalled on `ubuntu-latest`. Scoped to structural invariants the
  # assert_cmd suite does not already pin exactly; it does not re-run
  # command-execution coverage.
  docs-examples:
    name: Docs Examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify init/run/report structural invariants
        run: ./scripts/ci/check-docs-examples.sh --build

  # Docs build once on the primary (HiGHS) backend; NOT duplicated onto CLP.
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Cache MPICH
        id: mpich-cache
        uses: actions/cache@v5
        with:
          path: /opt/mpich
          key: mpich-${{ env.MPICH_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build MPICH from source
        if: steps.mpich-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q "https://www.mpich.org/static/downloads/${MPICH_VERSION}/mpich-${MPICH_VERSION}.tar.gz"
          tar xzf "mpich-${MPICH_VERSION}.tar.gz"
          cd "mpich-${MPICH_VERSION}"
          ./configure --prefix=/opt/mpich \
              --disable-fortran \
              --disable-cxx \
              --disable-romio \
              --disable-doc \
              --with-device=ch3:nemesis
          make -j"$(nproc)"
          make install
      - name: Set MPICH environment
        run: |
          echo "/opt/mpich/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=/opt/mpich/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/mpich/lib" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --features "${{ env.NON_SOLVER_FEATURES }}"
        env:
          RUSTDOCFLAGS: -Dwarnings

  # cargo-audit reads Cargo.lock and the advisory DB; it does not compile any
  # crate, so it never trips cobre-solver's both-backends `compile_error!`.
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  # cargo-deny resolves the dependency/feature graph for advisory, license, and
  # bans checks; it does NOT compile cobre-solver, so `--all-features` here only
  # widens the advisory graph and never trips the both-backends `compile_error!`.
  deny:
    name: Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  # THIRD_PARTY_LICENSES.md is generated by cargo-about (it reproduces the Rust
  # dependency licenses for binary distribution). Regenerate it here and fail if
  # the committed copy has drifted from the dependency graph, so the notices can
  # never silently go stale. cargo-about is version-pinned because its output
  # format is version-dependent (an unpinned bump would read as spurious drift).
  license-notices:
    name: License Notices
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-about --version 0.9.0 --locked --features cli
      - name: Regenerate and check for drift
        run: |
          cargo about generate --all-features about.hbs -o THIRD_PARTY_LICENSES.md
          if ! git diff --quiet -- THIRD_PARTY_LICENSES.md; then
            echo "::error::THIRD_PARTY_LICENSES.md is stale. Regenerate with: cargo about generate --all-features about.hbs -o THIRD_PARTY_LICENSES.md" >&2
            git --no-pager diff -- THIRD_PARTY_LICENSES.md | head -80
            exit 1
          fi

  # Coverage runs once on the primary (HiGHS) backend; NOT duplicated onto CLP.
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Cache MPICH
        id: mpich-cache
        uses: actions/cache@v5
        with:
          path: /opt/mpich
          key: mpich-${{ env.MPICH_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build MPICH from source
        if: steps.mpich-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q "https://www.mpich.org/static/downloads/${MPICH_VERSION}/mpich-${MPICH_VERSION}.tar.gz"
          tar xzf "mpich-${MPICH_VERSION}.tar.gz"
          cd "mpich-${MPICH_VERSION}"
          ./configure --prefix=/opt/mpich \
              --disable-fortran \
              --disable-cxx \
              --disable-romio \
              --disable-doc \
              --with-device=ch3:nemesis
          make -j"$(nproc)"
          make install
      - name: Set MPICH environment
        run: |
          echo "/opt/mpich/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=/opt/mpich/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/mpich/lib" >> "$GITHUB_ENV"
      - name: Install flatc (FlatBuffers compiler)
        run: sudo apt-get update && sudo apt-get install -y flatbuffers-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cov
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo llvm-cov --workspace --features "${{ env.NON_SOLVER_FEATURES }}" --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  python:
    name: Python Bindings (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Cache MPICH
        id: mpich-cache
        uses: actions/cache@v5
        with:
          path: /opt/mpich
          key: mpich-${{ env.MPICH_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build MPICH from source
        if: steps.mpich-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q "https://www.mpich.org/static/downloads/${MPICH_VERSION}/mpich-${MPICH_VERSION}.tar.gz"
          tar xzf "mpich-${MPICH_VERSION}.tar.gz"
          cd "mpich-${MPICH_VERSION}"
          ./configure --prefix=/opt/mpich \
              --disable-fortran \
              --disable-cxx \
              --disable-romio \
              --disable-doc \
              --with-device=ch3:nemesis
          make -j"$(nproc)"
          make install
      - name: Set MPICH environment
        run: |
          echo "/opt/mpich/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=/opt/mpich/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/mpich/lib" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: python
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest pytest-cov pyarrow
      - name: Build CLI for frontend affinity parity
        if: matrix.python-version == '3.12'
        run: cargo build --release -p cobre-cli
      - name: Smoke test NUMA benchmark harness
        if: matrix.python-version == '3.12'
        run: |
          python scripts/benchmark_numa.py \
            examples/deterministic/d01-thermal-dispatch \
            --binary target/release/cobre \
            --results "${{ runner.temp }}/numa-benchmark" \
            --threads 1 2 \
            --policies none core numa \
            --repetitions 2
      - name: Build and install cobre-python
        working-directory: crates/cobre-python
        run: |
          source ../../.venv/bin/activate
          maturin develop --release
      - name: Run Python tests with coverage
        run: |
          source .venv/bin/activate
          pytest crates/cobre-python/tests/ -v --cov=cobre --cov-report=xml:python-coverage.xml
      # Execute the quickstart notebook end-to-end against the locally built
      # wheel (the `maturin develop` artifact above — never a PyPI install) so
      # it cannot silently break. Run once on the lowest matrix Python; nbmake
      # treats any cell error as a test failure. pytest runs from the repo root,
      # and nbmake executes the notebook with its own directory as cwd, so the
      # notebook's `../1dtoy/` case path resolves to examples/1dtoy/.
      - name: Run quickstart notebook
        if: matrix.python-version == '3.12'
        run: |
          source .venv/bin/activate
          # Loose upper bounds so a future major release of these floating deps
          # cannot false-fail the notebook for reasons unrelated to cobre.
          pip install 'nbmake>=1.5,<2' 'polars>=1.0,<2' 'matplotlib>=3.8,<4'
          pytest --nbmake examples/notebooks/quickstart.ipynb
      - uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.12'
        with:
          files: python-coverage.xml
          flags: python
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
