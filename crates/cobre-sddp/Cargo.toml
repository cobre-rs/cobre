[package]
name = "cobre-sddp"
description = "Stochastic Dual Dynamic Programming (SDDP) for hydrothermal dispatch and energy planning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["sddp", "hydrothermal", "dispatch", "optimization", "energy"]
categories = ["science", "simulation", "mathematics"]

[features]
## Default feature set: build against the HiGHS solver backend.
default = ["highs"]

## Select the HiGHS LP solver backend (enables `cobre-solver/highs`).
##
## This is on by default. The per-phase `PhaseProfiles for HighsProfile` impl
## and the `FORWARD_PROFILE`/`BACKWARD_PROFILE`/`SIMULATION_PROFILE` constants in
## `solver_phase.rs` are gated on this feature.
highs = ["cobre-solver/highs"]

## Select the CLP/CoinUtils LP solver backend (enables `cobre-solver/clp`).
##
## Gates the per-phase `PhaseProfiles for ClpProfile` impl in `solver_phase.rs`.
clp = ["cobre-solver/clp"]

## Enable DHAT heap profiling instrumentation.
##
## When enabled, the global allocator is replaced with `dhat::Alloc` and the
## `dhat_baseline` example writes a `dhat-heap.json` profile on exit.
##
## **Never enable by default** — replaces the global allocator and slows
## every allocation.  Only activate when running the `dhat_baseline` example.
dhat-heap = ["dep:dhat"]

## Opt-in to the slow test suite.
##
## Tests gated by this feature (D-case sweep, FPHA plane-selection unit tests,
## and forward-sampler convergence integration tests) are ignored by default so
## that `cargo test --workspace` completes quickly.  Pass `--features slow-tests`
## to include them.
slow-tests = []

## Expose crate-internal test fixtures (EquipmentCounts builders) to other
## crates' integration tests.
##
## The shared `test_support` builders are gated on
## `#[cfg(any(test, feature = "test-support"))]`, so plain `cargo test` sees
## them via `test` and downstream integration tests see them via this feature.
## Must NOT be enabled in production builds.
test-support = ["cobre-core/test-support"]

[dependencies]
cobre-core = { version = "0.16.0", path = "../cobre-core" }
cobre-solver = { version = "0.16.0", path = "../cobre-solver", default-features = false }
cobre-comm = { version = "0.16.0", path = "../cobre-comm" }
cobre-stochastic = { version = "0.16.0", path = "../cobre-stochastic" }
cobre-io = { version = "0.16.0", path = "../cobre-io" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
dhat = { version = "0.3", optional = true }
matrixmultiply = { workspace = true }
rayon = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
arrow = { version = "60", default-features = false, features = ["prettyprint"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
cobre-core = { version = "0.16.0", path = "../cobre-core", features = ["test-support"] }
criterion = { version = "0.8", default-features = false }
# Used only by the `dcs_batched_scoring` bench to reproduce the pre-batching
# per-candidate `dgemm` baseline (the crate's own `gemm_block` wrapper is
# `pub(crate)` and so unreachable from a bench). Same pin as the normal dep.
matrixmultiply = { workspace = true }
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
proptest = "1"
rand = "0.10"
rand_distr = "0.6"
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tracing-subscriber = "0.3"

[[bench]]
name = "backward_stats_gather"
harness = false

[[bench]]
name = "cut_application_anticipated_state"
harness = false
required-features = ["test-support"]

[[bench]]
name = "cut_selection"
harness = false

[[bench]]
name = "cut_selection_kernel"
harness = false

[[bench]]
name = "dcs_batched_scoring"
harness = false
required-features = ["test-support"]

[[bench]]
name = "patch_fill"
harness = false
required-features = ["test-support"]

# Override unsafe_code to "allow" for this crate because it has two unsafe
# surfaces, each isolated behind a safe wrapper: (1) the cut-selection kernel
# calls `matrixmultiply::dgemm` (a `pub unsafe fn`) via `src/gemm.rs`, and
# (2) the convex-hull fitter binds the vendored qhull C library through the
# `unsafe extern "C"` shim in `src/hull/ffi.rs` and the RAII/`SAFETY`-guarded
# blocks in `src/hull/mod.rs`. All other workspace lints are manually
# replicated here since Cargo does not permit combining
# `lints.workspace = true` with per-lint overrides in the same crate manifest.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
too_many_arguments = "deny"
